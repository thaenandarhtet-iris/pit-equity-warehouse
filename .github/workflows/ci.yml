name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/data/pitwh.duckdb
      PARQUET_DIR: ${{ github.workspace }}/data/parquet
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest

      - name: dbt seed and build (offline fixtures)
        run: make build-fixtures
